name: Deploy to CPanel

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: FTP Deploy Action
    runs-on: ubuntu-latest

    steps:
      # Checkout do código
      - uses: actions/checkout@v2.1.0
        with:
          fetch-depth: 2

      # Instala e compila assets
      - name: Build assets
        run: |
          npm install
          npm run build

      # Instala PHP e Composer
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: 'composer'

      # Instala dependências do PHP em modo produção
      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      # (Opcional) Limpar arquivos locais antes do deploy
      # - name: Cleanup build artifacts
      #   run: rm -rf node_modules tests .git .github

      # Deploy via FTP
      - name: Deploy to CPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        continue-on-error: true  # Evita quebra total se o disco estiver cheio
        with:
          server: ${{ secrets.CPANEL_SERVER }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          server-dir: /api/
          # dangerous-clean-slate: true  # Remove tudo do diretório remoto antes de enviar (usar com cautela)
